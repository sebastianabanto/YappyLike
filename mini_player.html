<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YappyLike</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfbfb;
        --fg: #1a1a1a;
        --sub: #5a5a5a;
        --accent: #0067c0;
        --accent-fg: #ffffff;
        --card: #ffffff;
        --border: #e2e2e2;
        --hover: #f0f0f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #202020;
          --fg: #f2f2f2;
          --sub: #a9a9a9;
          --accent: #4cc2ff;
          --accent-fg: #05243a;
          --card: #2b2b2b;
          --border: #3a3a3a;
          --hover: #383838;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        color: var(--fg);
        background: transparent;
        user-select: none;
        overflow: hidden;
      }
      .card {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 10px 6px 12px;
      }
      .brand {
        font-weight: 600;
        letter-spacing: 0.02em;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .brand .dot {
        color: var(--accent);
        margin-right: 6px;
      }
      #status {
        color: var(--sub);
        font-size: 12px;
        padding: 0 12px 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-variant-numeric: tabular-nums;
      }
      .controls {
        display: flex;
        gap: 6px;
        padding: 4px 10px 10px;
        margin-top: auto;
      }
      button {
        font: inherit;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 6px 8px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--fg);
        cursor: pointer;
        line-height: 1;
      }
      button:hover { background: var(--hover); }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
      }
      button .ico { font-size: 13px; }
      .iconbtn { flex: 0 0 34px; padding: 6px 0; }
    </style>
  </head>
  <body>
    <div class="card">
      <header data-tauri-drag-region>
        <span class="brand" data-tauri-drag-region>
          <span class="dot">●</span>YappyLike
        </span>
        <button id="close" class="iconbtn" title="Cerrar">✕</button>
      </header>
      <div id="status">…</div>
      <div class="controls">
        <button id="pause" class="primary">
          <span class="ico" id="pause_ico">⏸</span>
          <span id="pause_label">Pausa</span>
        </button>
        <button id="stop" class="iconbtn" title="Detener"><span class="ico">⏹</span></button>
      </div>
    </div>
    <script type="module" src="/src/mini_player.ts"></script>
  </body>
</html>
